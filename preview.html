<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Tracker Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@300;600&display=swap');
  :root { --fg: #e2f3ff; --muted: #8899aa; --accent: #ff6b35; --card: #0d1b2a; --bg: #060b14; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: 'Inter', sans-serif; padding: 20px; display: flex; justify-content: center; }
  .phone { width: 375px; height: 720px; border: 2px solid #1a2a3a; border-radius: 28px; overflow: hidden; background: linear-gradient(180deg, #060b14 0%, #091325 100%); box-shadow: 0 0 40px rgba(255,107,53,0.15); position: relative; }
  .header { padding: 24px 20px 10px; text-align: center; letter-spacing: 3px; font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--fg); border-bottom: 1px solid #1a2a3a; }
  .section { padding: 16px 16px; }
  .subtitle { color: var(--muted); font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .card { background: var(--card); border: 1px solid #1a2a3a; border-radius: 12px; padding: 12px; text-align: center; }
  .day { font-size: 11px; font-weight: bold; color: var(--fg); margin-bottom: 6px; letter-spacing: 1px; }
  .pct { font-size: 20px; font-weight: bold; color: #00ffa3; }
  .label { font-size: 9px; color: #556677; margin-top: 2px; }
  .nav { position: absolute; bottom: 0; left: 0; right: 0; display: flex; background: #060b14; border-top: 1px solid #1a2a3a; padding: 10px; }
  .nav-btn { flex: 1; text-align: center; padding: 8px; color: var(--muted); font-size: 11px; font-weight: bold; border-radius: 8px; }
  .nav-btn.active { background: var(--accent); color: #fff; }
  .dashboard-card { background: var(--card); border: 1px solid #1a2a3a; border-radius: 14px; padding: 16px; margin-bottom: 10px; }
  .tag { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-right: 6px; }
  .tag.orange { background: #ffaa00; color: #000; }
  .tag.red { background: #ff3b3b; color: #fff; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">PROGRESS TRACKER</div>
  <div class="section">
    <div class="subtitle">Weekly Overview</div>
    <div class="grid">
      <div class="card"><div class="day">MON</div><div class="pct">92%</div><div class="label">done</div></div>
      <div class="card"><div class="day">TUE</div><div class="pct">68%</div><div class="label">done</div></div>
      <div class="card"><div class="day">WED</div><div class="pct">45%</div><div class="label">done</div></div>
      <div class="card"><div class="day">THU</div><div class="pct">100%</div><div class="label">done</div></div>
    </div>
  </div>
  <div class="section">
    <div class="subtitle">Dashboard Metrics</div>
    <div class="dashboard-card">
      <strong>Skip Analytics</strong> — Today: 0 | Week: 2 | Month: 5 | Year: 12
      <div style="margin-top:10px"><span class="tag orange">Important • 5</span><span class="tag red">Very Important • 3</span></div>
    </div>
    <div class="dashboard-card">
      <strong>Completion Rate: 72%</strong> · Avg Time: 2h 14m
    </div>
  </div>
  <div class="nav">
    <div class="nav-btn active">CALENDAR</div>
    <div class="nav-btn">DASHBOARD</div>
    <div class="nav-btn">ADD</div>
  </div>
</div>
</body>
</html>
