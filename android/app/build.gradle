plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ewok67.disciplinetracker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ewok67.disciplinetracker'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        // 64-bit only: the assistant needs the RAM, and llama.cpp's fp16
        // kernels require arm64. Every phone that can run it is arm64.
        ndk {
            abiFilters 'arm64-v8a'
        }
        ndkVersion '27.0.12077973'
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
