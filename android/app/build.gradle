plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ewok67.disciplinetracker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ewok67.disciplinetracker'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.0.5'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Committed to the repo so every build signs with the same key —
        // required for APK updates to install over the previous version.
        debug {
            storeFile file("../signing.p12")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeType "PKCS12"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
