<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@300;600&display=swap');
:root{--fg:#e2f3ff;--muted:#8899aa;--accent:#ff6b35;--card:#0d1b2a;--bg:#060b14;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--fg);display:flex;justify-content:center;align-items:center;min-height:100vh}
.phone{width:390px;height:820px;background:linear-gradient(180deg,#060b14 0%,#091325 100%);border:2px solid #1a2a3a;border-radius:32px;overflow:hidden;box-shadow:0 0 50px rgba(255,107,53,0.12);position:relative;display:flex;flex-direction:column}
.header{padding:22px 24px 8px;text-align:center;letter-spacing:3px;font-family:'Orbitron',sans-serif;font-size:16px;color:var(--fg);border-bottom:1px solid #1a2a3a;background:#060b14}
.screen{flex:1;padding:10px;overflow:hidden}
.subtitle{color:var(--muted);font-size:11px;letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:var(--card);border:1px solid #1a2a3a;border-radius:14px;padding:14px;text-align:center}
.day{font-size:11px;font-weight:bold;color:var(--fg);margin-bottom:6px;letter-spacing:1px}
.pct{font-size:22px;font-weight:bold;color:#00ffa3}
.label{font-size:9px;color:#556677;margin-top:2px}
.dashboard-card{background:var(--card);border:1px solid #1a2a3a;border-radius:14px;padding:16px;margin-bottom:10px}
.tag{display:inline-block;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:bold;margin-right:6px;margin-top:6px}
.tag.orange{background:#ffaa00;color:#000}
.tag.red{background:#ff3b3b;color:#fff}
.nav{display:flex;background:#060b14;border-top:1px solid #1a2a3a;padding:10px;gap:6px}
.nav button{flex:1;padding:10px;border:none;border-radius:10px;background:#0d1b2a;color:var(--muted);font-size:11px;font-weight:bold;cursor:pointer;letter-spacing:1px;transition:all .2s}
.nav button.active{background:var(--accent);color:#fff}
input,select{width:100%;padding:14px;background:var(--card);color:var(--fg);border:1px solid #1a2a3a;border-radius:12px;font-size:15px;margin-bottom:12px}
button.save{width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-weight:bold;letter-spacing:2px;font-size:14px;cursor:pointer}
button.save:hover{filter:brightness(1.1)}
.task-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid #1a2a3a;border-radius:12px;padding:12px;margin-bottom:8px}
.task-row .priority-dot{width:10px;height:10px;border-radius:50%;margin-right:10px}
.task-row .priority-dot.orange{background:#ffaa00}
.task-row .priority-dot.red{background:#ff3b3b}
.hidden{display:none}
</style>
</head>
<body>
<div class="phone">
  <div class="header">PROGRESS TRACKER</div>

  <div id="screen-calendar" class="screen">
    <div class="subtitle" style="font-size:10px">MON TUE WED THU FRI SAT SUN</div>
    <div class="grid" style="grid-template-columns:repeat(7,1fr);font-size:10px;gap:3px;" id="calendar-grid"></div>
  </div>

  <div id="screen-day" class="screen hidden">
    <div class="subtitle" id="day-title">Tasks for Day</div>
    <div id="day-tasks"></div>
    <input id="edit-name" placeholder="Edit task name" style="margin-top:10px" />
    <select id="edit-priority" style="margin-top:6px">
      <option>not so important</option><option>important</option><option>very important</option>
    </select>
    <button class="save" onclick="updateTask()" style="margin-top:10px">SAVE CHANGES</button>
    <button onclick="show('calendar')" style="margin-top:10px;background:#1a2a3a;color:#fff;width:100%;padding:12px;border:1px solid #2a3a4a;border-radius:10px;font-weight:bold;letter-spacing:1px">BACK</button>
  </div>

  <div id="screen-dashboard" class="screen hidden">
    <div class="subtitle">Skip Analytics</div>
    <div class="dashboard-card"><strong>Skip Rate</strong> — Today: 0 | Week: 2 | Month: 5 | Year: 12</div>
    <div class="dashboard-card">
      <strong>Priority Overview</strong><br>
      <span class="tag orange">Important • 5</span><span class="tag red">Very Important • 3</span>
    </div>
    <div class="dashboard-card"><strong>Completion Rate: 72%</strong> · Avg Time: 2h 14m</div>
  </div>

  <div id="screen-add" class="screen hidden">
    <div class="subtitle">New Task</div>
    <input id="task-name" placeholder="Task name (e.g. Drink water)" />
    <select id="task-priority">
      <option value="not so important">Not so important</option>
      <option value="important">Important</option>
      <option value="very important">Very important</option>
    </select>
    <select id="task-repeat" style="margin-top:6px">
      <option value="daily">Daily</option>
      <option value="3daily">Every 3 days</option>
    </select>
    <button class="save" onclick="addTask()">SAVE TASK</button>
    <div class="subtitle" style="margin-top:20px">Your Tasks</div>
    <div id="task-list"></div>
  </div>

  <div class="nav">
    <button onclick="show('add')" style="flex:1;background:#ffaa00;color:#000;font-weight:bold">+ NEW</button>
    <button onclick="show('dashboard')" style="flex:1;background:#ff3b3b;color:#fff;font-weight:bold">DASHBOARD</button>
  </div>
</div>

<script>
const tasks = []; // started empty — you add everything
function save() { localStorage.setItem('pt_tasks', JSON.stringify(tasks)); }
function addTask() {
  const name = document.getElementById('task-name').value.trim();
  const priority = document.getElementById('task-priority').value;
  const repeat = document.getElementById('task-repeat').value;
  if (!name) return alert('Enter a name');
  tasks.push({ name, priority, repeat, completed: false, skipped: false, created: new Date().toISOString() });
  save(); document.getElementById('task-name').value = ''; renderTasks(); show('calendar');
}
function show(screen) {
  ['calendar', 'dashboard', 'add', 'day'].forEach(s => {
    document.getElementById('screen-' + s).classList.add('hidden');
    const btn = document.getElementById('btn-' + s);
    if (btn) btn.classList.remove('active');
  });
  document.getElementById('screen-' + screen).classList.remove('hidden');
  const btn = document.getElementById('btn-' + screen);
  if (btn) btn.classList.add('active');
  if (screen === 'add') renderTasks();
}
function renderTasks() {
  const list = document.getElementById('task-list');
  list.innerHTML = tasks.map((t, i) => {
    const c = t.priority === 'very important' ? 'red' : t.priority === 'important' ? 'orange' : '';
    return `<div class="task-row"><div style="display:flex;align-items:center"><div class="priority-dot ${c}"></div><span>${t.name}</span></div><span style="font-size:11px;color:#556677">${t.priority}</span></div>`;
  }).join('');
}
let selectedDay = 1;
function renderCalendar() {
  const grid = document.getElementById('calendar-grid');
  let html = '';
  // 5 rows = 5 weeks (35 slots), show 1-31, blank rest, fixed 5x7 grid
  for (let d=1; d<=35; d++) {
    if (d > 31) { html += `<div></div>`; continue; }
    html += `<div class="card" style="cursor:pointer;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;padding:4px" onclick="openDay(${d})"><div style="font-weight:bold">${d}</div><div style="font-size:10px;color:#00ffa3">0%</div></div>`;
  }
  grid.innerHTML = html;
}
function openDay(day) {
  selectedDay = day;
  document.getElementById('day-title').textContent = 'Tasks — Oct ' + day + ' (0%)';
  const list = document.getElementById('day-tasks');
  const dayTasks = tasks.filter(t => new Date(t.created).getDate() === day || true);
  list.innerHTML = dayTasks.map((t, i) => {
    const color = t.priority==='very important'?'red':t.priority==='important'?'orange':'';
    const done = t.completed ? '<span style="color:#00ffa3;font-weight:bold">✓ COMPLETED</span>' : '<span style="color:#ff3b3b;font-weight:bold">✗ PENDING</span>';
    return `<div class="task-row" onclick="toggleComplete(${i})" style="cursor:pointer"><div style="display:flex;align-items:center;gap:8px"><div class="priority-dot ${color}"></div><span style="font-weight:bold">${t.name}</span></div><div style="font-size:11px">${done}</div></div>`;
  }).join('') || '<p style="color:#556677;font-size:13px">No tasks for this day.</p>';
  document.getElementById('edit-name').value = ''; document.getElementById('edit-priority').value = 'not so important';
  show('day');
}
let editingIndex = -1;
function toggleComplete(i) { tasks[i].completed = !tasks[i].completed; save(); openDay(selectedDay); }
function editTask(i) { editingIndex = i; document.getElementById('edit-name').value = tasks[i].name; document.getElementById('edit-priority').value = tasks[i].priority; }
function updateTask() { if (editingIndex >= 0) { tasks[editingIndex].name = document.getElementById('edit-name').value; tasks[editingIndex].priority = document.getElementById('edit-priority').value; save(); openDay(selectedDay); } }
renderCalendar(); renderTasks();
</script>
</body>
</html>
