name: Build Android APK
on:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: npm install
      - run: npm run build:android || npx expo build:android --no-publish
      - uses: actions/upload-artifact@v4
        with:
          name: progress-tracker.apk
          path: '*.apk'
