name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Stable signing key, committed to the repo. Every build signs with this
      # exact file, so installed apps accept future APK updates no matter how
      # much time passes between builds (CI caches are evicted after 7 idle
      # days and would silently break update compatibility).
      - name: Verify signing key
        run: ls -la android/app/signing.p12

      - name: Read version from gradle
        id: version
        run: |
          VERSION=$(grep -oP "versionName\s+'\K[^']+" android/app/build.gradle | head -1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Copy web app into Android assets
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK (signed, installable)
        run: gradle assembleDebug --no-daemon -p android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: discipline-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Discipline Tracker v${{ steps.version.outputs.name }}
          body: |
            Install this APK on your phone. The app checks this release on
            launch and offers the update when a newer version is published.
          files: android/app/build/outputs/apk/debug/app-debug.apk
